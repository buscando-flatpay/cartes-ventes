<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {

	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;

	cursor:         grab;
	}
.leaflet-crosshair,

.leaflet-popup-pane,
.leaflet-control {

.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {

.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {

	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;

	}

	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;

	}

	}

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;

	}
.leaflet-control-layers-toggle {

	}

	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {

	}
.leaflet-control-layers label {
	display: block;

	font-size: 1.08333em;

.leaflet-control-layers-separator {

	background-image: url(images/marker-icon.png);

.leaflet-control-scale-line:not(:first-child) {

	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;

.leaflet-popup-content {

	}

.leaflet-popup-tip-container {

	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);

	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

	}
.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

	}
.leaflet-popup-scrolled {

	}

.leaflet-oldie .leaflet-popup-content-wrapper {
	-ms-zoom: 1;
	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,
.leaflet-oldie .leaflet-popup-tip {

	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

	pointer-events: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;

.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

.leaflet-tooltip-left:before {

<style>
/* Layout: one-screen console — sales rail on the left, street map on the right */
:root{
  --ink:#0d1220;        /* page ground */
  --panel:#141b2d;      /* rail */
  --raise:#1c2540;      /* hover / chips */
  --line:#263152;       /* hairlines */
  --text:#e8ecf6;
  --muted:#8c97b5;
  --sea:#0a1d33;        /* map water */
  --land:#18233b;       /* communes hors secteur */
  --land-in:#1f2d4c;    /* communes 13/83/05 */
  --border:#33426b;
  --warn:#f5b84a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,Segoe UI,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;margin:0;overflow:hidden}
*{box-sizing:border-box}
.app{display:flex;height:100%;}
.rail{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-left:env(safe-area-inset-left,0px)}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.3px;margin:0;line-height:1;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);font-size:12px}
.label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:14px 18px 6px;font-weight:600}
.sales{display:flex;flex-direction:column;padding:0 10px;gap:2px}
.sale{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:none;color:var(--text);font:inherit;text-align:left;width:100%}
.sale:hover{background:var(--raise)}
.sale:focus-visible{outline:2px solid var(--c,#fff);outline-offset:1px}
.sale.on{background:var(--raise);border-color:var(--c)}
.sw{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent);flex-shrink:0}
.sale .nm{flex:1;font-weight:500}
.sale .ct{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sale.on .ct{color:var(--c)}
.allbtn .sw{background:conic-gradient(#ff5d73 0 60deg,#ffb020 0 120deg,#3ddc97 0 180deg,#38bdf8 0 240deg,#a78bfa 0 300deg,#f472b6 0);box-shadow:none}
.search{margin:12px 18px 4px;position:relative}
.search input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;font-size:13px}
.search input:focus{outline:none;border-color:var(--muted)}
.list{flex:1;overflow-y:auto;min-height:0;padding:4px 10px 14px}
.item{display:grid;grid-template-columns:8px 1fr;gap:4px 10px;padding:7px 8px;border-radius:6px;cursor:pointer;background:none;border:0;color:var(--text);font:inherit;text-align:left;width:100%}
.item:hover{background:var(--raise)}
.item .d{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:5px}
.item .t{font-size:13px;font-weight:500;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.item .s{grid-column:2;font-size:11.5px;color:var(--muted);line-height:1.3}
.item.nogeo .d{background:transparent;border:1.5px dashed var(--muted)}
.item .w{color:var(--warn)}
.foot{border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted)}
.mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--sea)}
.hud{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:500;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px);min-width:170px}
.hud .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hud .sub{font-size:12px;color:var(--muted);margin-top:3px}

<div class="gate" id="gate">

  </form>
</div>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>Ventes Sud-Est</h1>

    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
let DATA,TEAMS,COLORS,UPDATED;
const PALETTE=["#ff5d73","#ffb020","#3ddc97","#38bdf8","#a78bfa","#f472b6","#ff7a2f","#22d3c5","#a3e635","#e879f9","#fde047","#6d8bff","#fb7185","#34d399","#c084fc","#fbbf24"];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let ENC=null;
const encP=fetch('ventes.enc.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>ENC=j);
async function unlock(pw){
  const e=ENC||await encP;
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
document.getElementById('gateform').addEventListener('submit',async ev=>{
  ev.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Ouverture…';err.textContent='';
  try{
    const j=await unlock(document.getElementById('pw').value);
    DATA=j.ventes;TEAMS=j.equipes;COLORS=j.couleurs||{};UPDATED=j.maj;
    let k=0;Object.values(TEAMS).flat().forEach(s=>{if(!COLORS[s])COLORS[s]=PALETTE.filter(c=>!Object.values(COLORS).includes(c))[0]||PALETTE[k++%PALETTE.length]});
    DATA.forEach(d=>{if(!Object.values(TEAMS).flat().includes(d.s)){(TEAMS['Autres']=TEAMS['Autres']||[]).push(d.s);COLORS[d.s]=COLORS[d.s]||'#cbd5e1'}});
    document.getElementById('gate').hidden=true;init();
  }catch(x){
    err.textContent=x instanceof DOMException||x.name==='OperationError'?'Mot de passe incorrect.':'Impossible de charger les ventes. Recharge la page.';
    btn.disabled=false;btn.textContent='Ouvrir la carte';
  }
});
function init(){
const TEAM_OF={};Object.entries(TEAMS).forEach(([t,l])=>l.forEach(s=>TEAM_OF[s]=t));
const cnt=s=>DATA.filter(d=>d.s===s).length;
Object.keys(TEAMS).forEach(t=>TEAMS[t].sort((a,b)=>cnt(b)-cnt(a)));
const css=getComputedStyle(document.documentElement);
const tok=n=>css.getPropertyValue(n).trim();
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const map=L.map('map',{zoomControl:true,attributionControl:false,maxZoom:19,preferCanvas:true,zoomSnap:.25}).setView([43.5,5.6],8);
// Fond : plan Esri quand il est autorisé ; sinon fond embarqué (communes + villes), toujours disponible.
map.createPane('fond');map.getPane('fond').style.zIndex=250;
const attr=L.control.attribution({prefix:false}).addTo(map);
let fondVect=null;
function fondEmbarque(){if(fondVect)return;
  fondVect=L.layerGroup().addTo(map);
  fetch('communes.json').then(r=>r.json()).then(g=>{
    const SECT=new Set(['13','83','84','04','05','06','26','07','30']);
    L.geoJSON(g,{pane:'fond',interactive:true,style:f=>({color:tok('--border'),weight:.6,opacity:.9,fillColor:tok('--land-in'),fillOpacity:1}),
      onEachFeature:(f,l)=>l.bindTooltip(f.properties.n,{sticky:true,className:'cm',direction:'top',offset:[0,-6]})}).addTo(fondVect);
  }).catch(()=>{});
  VILLES.forEach(([n,la,lo,z])=>{const m=L.marker([la,lo],{pane:'fond',interactive:false,icon:L.divIcon({className:'ville',html:'<span>'+n+'</span>',iconSize:[0,0]})});m._z=z;fondVect.addLayer(m)});
  const maj=()=>{const z=map.getZoom();fondVect.eachLayer(l=>{if(l._z!=null&&l._icon)l._icon.style.display=z>=l._z?'':'none'})};map.on('zoomend',maj);setTimeout(maj,50);
  attr.addAttribution('Fond : communes IGN/OSM');
}
const VILLES=[["Marseille",43.296,5.37,7],["Toulon",43.124,5.93,7],["Avignon",43.949,4.806,7],["Aix-en-Provence",43.529,5.447,8],["Nîmes",43.837,4.36,8],["Montélimar",44.558,4.751,8],["Hyères",43.12,6.13,9],["La Ciotat",43.175,5.605,9],["Aubagne",43.293,5.57,9],["Martigues",43.405,5.048,9],["Istres",43.513,4.987,9],["Salon-de-Provence",43.64,5.097,9],["Arles",43.677,4.63,8],["Carpentras",44.055,5.048,9],["Orange",44.138,4.808,9],["Cavaillon",43.837,5.038,9],["Apt",43.876,5.396,9],["Pertuis",43.694,5.502,9],["Manosque",43.828,5.786,8],["Brignoles",43.406,6.062,9],["Draguignan",43.537,6.465,9],["La Seyne-sur-Mer",43.101,5.879,10],["Six-Fours",43.094,5.84,10],["Bandol",43.136,5.753,10],["Vitrolles",43.46,5.249,10],["Marignane",43.416,5.215,10],["Gardanne",43.455,5.469,10],["Aubenas",44.62,4.39,9],["Privas",44.735,4.599,9],["Gap",44.559,6.079,8],["Digne-les-Bains",44.092,6.236,9]];
const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:19});
let ok=0,ko=0;
esri.on('tileload',()=>{ok++;if(ok===1)attr.addAttribution('Plan &copy; Esri')});
esri.on('tileerror',()=>{ko++;if(ko>=3&&ok===0){map.removeLayer(esri);fondEmbarque()}});
esri.addTo(map);
setTimeout(()=>{if(ok===0){map.removeLayer(esri);fondEmbarque()}},4000);

const seen={};
DATA.forEach(d=>{if(d.lat==null)return;const k=d.lat+','+d.lon;const n=seen[k]=(seen[k]||0)+1;if(n>1){const a=n*2.4,r=.00035*Math.sqrt(n);d.plat=d.lat+r*Math.sin(a);d.plon=d.lon+r*Math.cos(a)}else{d.plat=d.lat;d.plon=d.lon}});

const layer=L.layerGroup().addTo(map);
let team='all',current='all',query='',cat=null,vue='map';
const markers=new Map();
const teamLabel=t=>t==='all'?'Toutes les équipes':(t==='Autres'?'Autres (anciens sales, managers)':'Équipe '+t);

function popup(d){const c=COLORS[d.s];return `<div class="pp" style="--c:${c}"><div class="k">Vente · ${esc(TEAM_OF[d.s]==='Autres'?'Autres':'Équipe '+TEAM_OF[d.s])}</div><h3>${esc(d.n)}</h3>${d.c?`<div class="cat">${esc(d.c)}</div>`:''}<div class="sir">SIREN ${esc(d.siren)}</div><p class="ad">${esc(d.a)}</p>${d.r?`<div class="wr">${esc(d.r)}</div>`:''}<div class="by"><i></i>${esc(d.s)}</div>${d.lat!=null||d.v?`<a class="gm" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.a&&!/non publique|inconnue/.test(d.a)?d.a:(d.lat!=null?d.lat+','+d.lon:d.v))}" target="_blank" rel="noopener">Voir sur Google Maps ↗</a>`:''}</div>`}

function visible(){
  const q=query.toLowerCase();
  return DATA.filter(d=>(team==='all'||TEAM_OF[d.s]===team)&&(current==='all'||d.s===current)&&(!cat||d.c===cat)&&(!q||(d.n+' '+d.a+' '+d.siren+' '+(d.v||'')).toLowerCase().includes(q)));
}
const D30=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
const c30=s=>DATA.filter(d=>d.s===s&&d.d&&d.d>=D30).length;
const inis=s=>s.split(/[\s-]+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function tile(s,mx,rank){const n=cnt(s),r=c30(s),[f,...l]=s.split(' ');
  return `<button class="sale" data-s="${esc(s)}" style="--c:${COLORS[s]}" title="${esc(s)} · ${n} ventes, dont ${r} sur 30 jours">
    <span class="av">${esc(inis(s))}</span><span class="ct">${n}</span>
    <span class="nm">${esc(f)} <em>${esc(l.join(' '))}</em></span>
    <span class="mb"><i style="width:${(n/mx*100).toFixed(1)}%"></i></span>
    <span class="r3">${r?`<b>+${r}</b> en 30 j`:'— en 30 j'}</span>${rank<3?`<span class="md">${['🥇','🥈','🥉'][rank]}</span>`:''}</button>`}
function drawSales(){
  document.getElementById('teams').innerHTML=['all',...Object.keys(TEAMS)].map(x=>`<button data-t="${esc(x)}" role="tab">${x==='all'?'Toutes':esc(x)}</button>`).join('');
  const teams=team==='all'?Object.keys(TEAMS):[team];
  const rows=DATA.filter(d=>team==='all'||TEAM_OF[d.s]===team);const tot=rows.length,t30=rows.filter(d=>d.d&&d.d>=D30).length;
  let h=`<button class="sale allbtn" data-s="all"><span class="av">★</span><span class="nm">${team==='all'?'Tous les commerciaux':"Toute l'équipe"}</span><span class="ct">${tot}</span><span class="r3"><b>+${t30}</b> en 30 j</span></button>`;
  teams.forEach(t=>{const L=TEAMS[t];const mx=Math.max(1,...L.map(cnt));
    if(team==='all'){const tt=DATA.filter(d=>TEAM_OF[d.s]===t).length;h+=`<div class="tl"><span>${t==='Autres'?'Autres · anciens & managers':'Équipe '+esc(t)}</span><b>${tt}</b></div>`}
    h+=L.map((s,i)=>tile(s,mx,t==='Autres'?9:i)).join('')});
  document.getElementById('sales').innerHTML=h;
  document.querySelectorAll('#teams button').forEach(b=>{const on=b.dataset.t===team;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
}
function render(){
  layer.clearLayers();markers.clear();
  const rows=visible();const pts=[];
  const big=current!=='all';
  rows.forEach(d=>{if(d.plat==null)return;
    const m=L.circleMarker([d.plat,d.plon],{radius:big?7:5,color:'#ffffff',weight:big?1.6:1.2,fillColor:COLORS[d.s],fillOpacity:.95}).bindPopup(popup(d));
    m.addTo(layer);markers.set(d,m);pts.push([d.plat,d.plon]);});
  const list=document.getElementById('list');
  list.innerHTML=rows.map(d=>`<button class="item${d.plat==null?' nogeo':''}" data-i="${DATA.indexOf(d)}" style="--c:${COLORS[d.s]}"><span class="d"></span><span class="t">${esc(d.n)}</span><span class="s">${esc(d.v||'Adresse non publique')}${current==='all'?' · '+esc(d.s.split(' ')[0]):''}${d.r?' · <span class="w">à vérifier</span>':''}</span></button>`).join('')||'<p style="color:var(--muted);padding:8px">Aucune vente ne correspond.</p>';
  const who=current==='all'?teamLabel(team):current;
  document.getElementById('listlabel').textContent=(current==='all'?'Ventes · '+teamLabel(team):'Ventes de '+current)+' ('+rows.length+')';
  const off=rows.filter(d=>d.plat==null).length;
  const hud=document.getElementById('hud');
  hud.style.setProperty('--c',current==='all'?tok('--text'):COLORS[current]);
  hud.innerHTML=`<div class="who" style="color:var(--c)">${esc(who)}</div><div class="big">${rows.length}</div><div class="sub">ventes · ${rows.length-off} sur la carte${off?`, ${off} sans point`:''}</div>`;
  document.querySelectorAll('.sale').forEach(b=>b.classList.toggle('on',b.dataset.s===current));
  document.getElementById('catchip').innerHTML=cat?`<div class="catchip"><span>Catégorie : <strong>${esc(cat)}</strong></span><button id="catx" aria-label="Retirer le filtre catégorie">✕</button></div>`:'';
  if(vue==='ana')renderAna();
  return pts;
}
function fit(pts){
  const inZone=pts.filter(p=>p[0]>42.9&&p[0]<45.5&&p[1]>4.2&&p[1]<7.4);
  if(inZone.length)map.flyToBounds(L.latLngBounds(inZone).pad(.08),{duration:.6,maxZoom:14});
}
function save(){try{localStorage.setItem('carte',JSON.stringify({team,current}))}catch(_){}}
document.getElementById('teams').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;team=b.dataset.t;current='all';drawSales();fit(render());save()});
document.getElementById('sales').addEventListener('click',e=>{const b=e.target.closest('.sale');if(!b)return;current=b.dataset.s;fit(render());save()});
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest('.item');if(!b)return;const d=DATA[+b.dataset.i];const m=markers.get(d);
  if(m){map.flyTo(m.getLatLng(),17,{duration:.5});setTimeout(()=>m.openPopup(),550)}});
let tm;document.getElementById('q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{query=e.target.value.trim();fit(render())},150)});
const fmtD=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
document.getElementById('sub').textContent=`${DATA.length} ventes · ${Object.keys(TEAMS).length} équipes · mise à jour le ${fmtD(UPDATED)}`;

// ---------- Analyse
const ACC='#38bdf8';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tip=document.getElementById('tip');
const showTip=(e,h)=>{tip.innerHTML=h;tip.hidden=false;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.max(8,e.clientY-tip.offsetHeight-10);tip.style.left=x+'px';tip.style.top=y+'px'};
document.addEventListener('mousemove',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(e,el.dataset.tip);else tip.hidden=true});
const pct=(a,b)=>b?Math.round(100*a/b):0;
const nf=n=>n.toLocaleString('fr-FR');
const ville=d=>(d.v||'').replace(/\s*\(\d+\)$/,'').replace(/^Marseille.*/,'Marseille')||null;
function count(rows,f){const m=new Map();rows.forEach(d=>{const k=f(d);if(k==null)return;m.set(k,(m.get(k)||0)+1)});return [...m.entries()].sort((a,b)=>b[1]-a[1])}
const CAT={'Restauration rapide':['🍔','#ff7a2f'],'Restaurant':['🍽️','#f43f5e'],'Bar / café':['☕','#f59e0b'],'Discothèque / club':['🪩','#e879f9'],
 'Boulangerie / pâtisserie':['🥖','#fbbf24'],'Boucherie / traiteur':['🥩','#ef4444'],'Épicerie / alimentation':['🛒','#22c55e'],'Tabac / presse / vape':['📰','#94a3b8'],
 'Coiffure / barbier':['💈','#38bdf8'],'Beauté / esthétique':['💅','#f472b6'],'Hôtellerie / hébergement':['🏨','#818cf8'],'Garage / auto / moto':['🚗','#60a5fa'],
 'Téléphonie / informatique':['📱','#2dd4bf'],'Mode / chaussures':['👗','#c084fc'],'Maison / déco / bricolage':['🛋️','#a3e635'],'Commerce de détail':['🛍️','#34d399'],
 'Fleuriste':['💐','#fb7185'],'Santé / pharmacie / optique':['💊','#4ade80'],'Sport / loisirs / culture':['🎯','#facc15'],'BTP / artisans du bâtiment':['🔨','#fdba74'],
 'Transport / taxi / livraison':['🚕','#fde047'],'Pressing / laverie':['🧺','#7dd3fc'],'Éducation / services à la personne':['🎓','#a78bfa'],'Artisanat / fabrication':['🛠️','#d6a76c'],
 'Holding / activité non précisée':['🏢','#64748b'],'Services aux entreprises':['💼','#93c5fd'],'Commerce de gros':['📦','#b45309'],'Agriculture':['🌾','#84cc16'],
 'Autres services':['✨','#cbd5e1'],'Non classé':['❔','#64748b']};
const catI=c=>CAT[c]||['•','#94a3b8'];
const MN=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MNL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const ini=s=>s.split(/[\s-]+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
let allCats=false,lastKey='';
const iso=x=>x.toISOString().slice(0,10);
function animate(root){
  root.querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n,suf=el.dataset.suf||'';if(RM){el.textContent=nf(to)+suf;return}
    const t0=performance.now(),d=900;const f=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=nf(Math.round(to*e))+suf;if(k<1)requestAnimationFrame(f)};el.textContent='0'+suf;requestAnimationFrame(f)});
  const go=()=>{root.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w);root.querySelectorAll('[data-h]').forEach(el=>el.style.height=el.dataset.h);root.querySelectorAll('[data-o]').forEach(el=>el.style.strokeDashoffset=el.dataset.o)};
  if(RM)go();else requestAnimationFrame(()=>requestAnimationFrame(go));
}
function ring(p,col,big,lab){const C=2*Math.PI*30;return `<div class="ring"><svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="30" class="bg"/><circle cx="36" cy="36" r="30" class="fg" style="stroke:${col};stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${C.toFixed(1)}" data-o="${(C*(1-p/100)).toFixed(1)}"/></svg><div class="rv"><b data-n="${p}" data-suf=" %">${p} %</b></div><div class="rl">${lab}</div></div>`}
function renderAna(){
  const sel=visible(),n=sel.length;
  const who=current!=='all'?current:teamLabel(team);
  const acc=current!=='all'?COLORS[current]:ACC;
  const refRows=current!=='all'?DATA.filter(d=>TEAM_OF[d.s]===TEAM_OF[current]):(team!=='all'?DATA:null);
  const refName=current!=='all'?(TEAM_OF[current]==='Autres'?'les Autres':"l'équipe "+TEAM_OF[current]):'toutes équipes';
  const today=new Date(),d30=iso(new Date(today-30*864e5)),d60=iso(new Date(today-60*864e5)),d90=iso(new Date(today-90*864e5));
  const dated=sel.filter(d=>d.d);const n30=dated.filter(d=>d.d>=d30).length,np=dated.filter(d=>d.d>=d60&&d.d<d30).length,dl=n30-np;
  const villes=count(sel,ville);
  const cats=count(sel,d=>d.c||'Non classé');
  const refCats=refRows?new Map(count(refRows,d=>d.c||'Non classé')):null,refN=refRows?refRows.length:0;
  const months=[];for(let i=11;i>=0;i--){const x=new Date(today.getFullYear(),today.getMonth()-i,1);months.push([x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),x])}
  const byM=new Map(count(dated,d=>d.d.slice(0,7)));const vals=months.map(([k])=>byM.get(k)||0);const mx=Math.max(1,...vals);
  const bi=vals.indexOf(Math.max(...vals));const best=vals[bi]?months[bi][1]:null;
  const act=vals.filter(v=>v>0);const avg=act.length?act.reduce((a,b)=>a+b,0)/act.length:0;
  const withCr=sel.filter(d=>d.cr&&d.d);const jeunes=withCr.filter(d=>(new Date(d.d)-new Date(d.cr))/864e5<365).length;
  const ei=sel.filter(d=>d.ej===1).length,ejK=sel.filter(d=>d.ej!=null).length;
  const cess=sel.filter(d=>/cessée|fermé/.test(d.r||'')).length;
  const top3=cats.slice(0,3).reduce((s,x)=>s+x[1],0);
  // --- à retenir
  const ins=[];
  if(cats[0]){const [c,v]=cats[0],p=pct(v,n),rp=refCats?pct(refCats.get(c)||0,refN):null;
    ins.push([catI(c)[0],catI(c)[1],`<b>${p} %</b> de ${current!=='all'?'ses':'leurs'} ventes : <b>${esc(c.toLowerCase())}</b>`,rp!=null?`${rp} % pour ${esc(refName)}`:`${nf(v)} commerces`])}
  if(refCats&&n>=5){let bx=null;cats.forEach(([c,v])=>{if(v<3)return;const g=pct(v,n)-pct(refCats.get(c)||0,refN);if(g>=5&&(!bx||g>bx[1]))bx=[c,g]});
    if(bx&&bx[0]!==(cats[0]&&cats[0][0]))ins.push([catI(bx[0])[0],catI(bx[0])[1],`Point fort : <b>${esc(bx[0].toLowerCase())}</b>`,`+${bx[1]} pts par rapport à ${esc(refName)}`])}
  if(villes[0])ins.push(['📍','#f472b6',`Terrain n°1 : <b>${esc(villes[0][0])}</b>`,`${pct(villes[0][1],n)} % des ventes · ${nf(villes.length)} communes au total`]);
  if(dated.length)ins.push([dl>0?'🚀':dl<0?'📉':'➡️',dl>0?'#3ddc97':dl<0?'#ff5d73':'#8c97b5',`<b>${nf(n30)}</b> vente${n30>1?'s':''} sur les 30 derniers jours`,dl?`${dl>0?'+':''}${dl} par rapport aux 30 jours d'avant`:'autant que les 30 jours d\'avant']);
  if(best)ins.push(['🏆','#fbbf24',`Meilleur mois : <b>${MNL[best.getMonth()]} ${best.getFullYear()}</b>`,`${vals[bi]} vente${vals[bi]>1?'s':''}`]);
  // --- en-tête
  const av=current!=='all'?`<span class="hav" style="--c:${acc}">${esc(ini(current))}</span>`:`<span class="hav team">${team==='all'?'★':esc(ini(team))}</span>`;
  let h=`<header class="hero" style="--c:${acc}">${av}<div><div class="kk">${current!=='all'?esc(TEAM_OF[current]==='Autres'?'Autres':'Équipe '+TEAM_OF[current]):'Vue d\'ensemble'}</div><h2>${esc(who)}</h2>
    <p>${nf(n)} vente${n>1?'s':''}${cat?` · ${catI(cat)[0]} ${esc(cat)}`:''}${query?` · recherche « ${esc(query)} »`:''}</p></div></header>`;
  h+=`<div class="kpis" style="--c:${acc}">
    <div class="kpi"><div class="ki">🧾</div><div class="v" data-n="${n}">${nf(n)}</div><div class="l">ventes au total</div></div>
    <div class="kpi"><div class="ki">⚡</div><div class="v" data-n="${n30}">${nf(n30)}</div><div class="l">sur les 30 derniers jours ${dated.length?`<span class="dl ${dl>0?'up':dl<0?'dn':''}">${dl>0?'▲ +':dl<0?'▼ ':''}${dl||'='}</span>`:''}</div></div>
    <div class="kpi"><div class="ki">🏆</div><div class="v">${best?MN[best.getMonth()].replace('.','')+' <small>'+vals[bi]+'</small>':'–'}</div><div class="l">meilleur mois (12 derniers mois)</div></div>
    <div class="kpi"><div class="ki">📍</div><div class="v" data-n="${villes.length}">${nf(villes.length)}</div><div class="l">communes touchées</div></div>
  </div>`;
  if(ins.length)h+=`<section class="ins">${ins.map(([i,c,t,s])=>`<div class="in" style="--k:${c}"><span class="ii">${i}</span><div><div class="it">${t}</div><div class="is">${s}</div></div></div>`).join('')}</section>`;
  // --- typologie
  const shown=allCats?cats:cats.slice(0,8);const cmax=Math.max(1,...cats.map(x=>pct(x[1],n)),...(refCats?cats.map(x=>pct(refCats.get(x[0])||0,refN)):[]));
  h+=`<div class="g2"><section class="card"><div class="ch"><h3>Typologie de clients</h3><span>${refCats?`<i class="lg"></i> moyenne ${esc(refName)}`:''}</span></div>
    <div class="cats">${shown.map(([c,v],i)=>{const p=pct(v,n),rp=refCats?pct(refCats.get(c)||0,refN):null,[e,col]=catI(c);
      return `<button class="cr${cat===c?' sel':''}" data-cat="${esc(c)}" style="--k:${col}" data-tip="${esc(`<strong>${c}</strong><br>${v} vente${v>1?'s':''} · ${p} %${rp!=null?`<br>${refName} : ${rp} %`:''}<br><span style='opacity:.7'>Clic : filtrer la carte</span>`)}">
        <span class="ce">${e}</span><span class="cl">${esc(c)}</span><span class="cn"><b>${nf(v)}</b> ${p} %</span>
        <span class="ct2"><i style="width:0;transition-delay:${i*45}ms" data-w="${(p/cmax*100).toFixed(1)}%"></i>${rp!=null?`<em style="left:${(rp/cmax*100).toFixed(1)}%"></em>`:''}</span></button>`}).join('')||'<p class="mut">Aucune vente.</p>'}</div>
    ${cats.length>8?`<button class="more" id="morecats">${allCats?'Réduire':`Voir les ${cats.length-8} autres catégories`}</button>`:''}</section>`;
  // --- rythme
  h+=`<section class="card" style="--c:${acc}"><div class="ch"><h3>Rythme des ventes</h3><span>12 derniers mois</span></div>
    <div class="mch">${avg?`<div class="avg" style="bottom:${(avg/mx*100).toFixed(1)}%"><span>moy. ${avg.toFixed(avg<10?1:0).replace('.',',')}</span></div>`:''}
    ${months.map(([k,x],i)=>{const v=vals[i];return `<div class="mc${i===bi&&v?' best':''}${i===11?' now':''}" data-tip="<strong>${MNL[x.getMonth()]} ${x.getFullYear()}</strong><br>${v} vente${v>1?'s':''}"><b>${v||''}</b><i style="height:0;transition-delay:${i*40}ms" data-h="${(v/mx*100).toFixed(1)}%"></i></div>`}).join('')}</div>
    <div class="mx">${months.map(([k,x])=>`<span>${MN[x.getMonth()].replace('.','')}</span>`).join('')}</div>
    ${dated.length<n?`<p class="mut sm">Dates connues pour ${nf(dated.length)} ventes sur ${nf(n)} (les plus anciennes viennent des fichiers Excel).</p>`:''}</section></div>`;
  // --- profil + communes
  const pod=villes.slice(0,3),rest=villes.slice(3,8);const ord=[1,0,2].filter(i=>pod[i]);
  h+=`<div class="g2"><section class="card"><div class="ch"><h3>Profil des clients</h3></div>
    <div class="rings">${ring(pct(jeunes,withCr.length),'#3ddc97','',`<b>Jeunes entreprises</b><br>moins d'un an à la signature`)}${ring(pct(ei,ejK),'#fbbf24','',`<b>Entrepreneurs individuels</b><br>plutôt que sociétés`)}${ring(pct(top3,n),'#a78bfa','',`<b>Spécialisation</b><br>poids des 3 premières catégories`)}</div>
    <div class="cess"><span>🔒</span><div><b data-n="${cess}">${cess}</b> client${cess>1?'s':''} fermé${cess>1?'s':''} ou cessé${cess>1?'s':''} depuis au registre</div></div></section>
    <section class="card"><div class="ch"><h3>Top communes</h3><span>siège de l'entreprise</span></div>
    ${pod.length?`<div class="pod">${ord.map(i=>`<div class="pd p${i+1}"><div class="pm">${['🥇','🥈','🥉'][i]}</div><div class="pn">${esc(pod[i][0])}</div><div class="pb" style="height:0" data-h="${[110,82,62][i]}px"><b>${pod[i][1]}</b><small>${pct(pod[i][1],n)} %</small></div></div>`).join('')}</div>
    ${rest.length?`<ol class="vl" start="4">${rest.map(([k,v])=>`<li><span>${esc(k)}</span><b>${v}</b></li>`).join('')}</ol>`:''}`:'<p class="mut">Aucune vente.</p>'}</section></div>`;
  // --- classement
  if(current==='all'){
    const ppl=[...new Set(sel.map(d=>d.s))];
    const st=ppl.map(s=>{const r=sel.filter(d=>d.s===s);const cc=count(r,d=>d.c||'Non classé')[0];
      return {s,n:r.length,n30:r.filter(d=>d.d&&d.d>=d30).length,n90:r.filter(d=>d.d&&d.d>=d90).length,cat:cc?cc[0]:null,cp:cc?pct(cc[1],r.length):0}}).sort((a,b)=>b.n30-a.n30||b.n90-a.n90||b.n-a.n);
    const m30=Math.max(1,...st.map(x=>x.n30));
    h+=`<section class="card"><div class="ch"><h3>Classement des commerciaux</h3><span>ventes des 30 derniers jours · clic pour le détail</span></div>
      <div class="lb">${st.map((x,i)=>`<button class="lr" data-s="${esc(x.s)}" style="--c:${COLORS[x.s]}"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="la">${esc(ini(x.s))}</span>
        <span class="ln"><b>${esc(x.s)}</b><span class="lt"><i style="width:0;transition-delay:${i*35}ms" data-w="${(x.n30/m30*100).toFixed(1)}%"></i></span></span>
        <span class="ls"><b>${x.n30}</b><small>30 j</small></span><span class="ls"><b>${x.n90}</b><small>90 j</small></span><span class="ls"><b>${x.n}</b><small>total</small></span>
        <span class="lc" title="Catégorie principale">${x.cat?catI(x.cat)[0]+' '+esc(x.cat)+' · '+x.cp+' %':'–'}</span></button>`).join('')}</div></section>`;
  }
  const root=document.getElementById('ana-in');root.innerHTML=h;animate(root);
  const key=team+'|'+current;if(key!==lastKey){lastKey=key;document.getElementById('ana').scrollTop=0}
}
document.getElementById('ana').addEventListener('click',e=>{
  if(e.target.closest('#morecats')){allCats=!allCats;renderAna();return}
  const r=e.target.closest('[data-cat]');if(r){cat=cat===r.dataset.cat?null:r.dataset.cat;fit(render());return}
  const t=e.target.closest('.lr');if(t){current=t.dataset.s;if(team!=='all'&&TEAM_OF[current]!==team){team=TEAM_OF[current];drawSales()}fit(render());save();document.getElementById('ana').scrollTo({top:0,behavior:RM?'auto':'smooth'})}
});
document.getElementById('catchip').addEventListener('click',e=>{if(e.target.closest('#catx')){cat=null;fit(render())}});
function setVue(v){vue=v;const a=v==='ana';document.getElementById('ana').hidden=!a;document.getElementById('hud').hidden=a;
  document.getElementById('v-map').classList.toggle('on',!a);document.getElementById('v-ana').classList.toggle('on',a);
  document.getElementById('v-map').setAttribute('aria-selected',!a);document.getElementById('v-ana').setAttribute('aria-selected',a);
  if(a)renderAna();else setTimeout(()=>map.invalidateSize(),50);try{localStorage.setItem('vue',v)}catch(_){}}
document.getElementById('v-map').addEventListener('click',()=>setVue('map'));
document.getElementById('v-ana').addEventListener('click',()=>setVue('ana'));
try{const s=JSON.parse(localStorage.getItem('carte')||'{}');if(s.team&&(s.team==='all'||TEAMS[s.team]))team=s.team;if(s.current&&(s.current==='all'||(COLORS[s.current]&&(team==='all'||TEAM_OF[s.current]===team))))current=s.current}catch(_){}
drawSales();fit(render());
try{if(localStorage.getItem('vue')==='ana')setVue('ana')}catch(_){}
}
</script>
